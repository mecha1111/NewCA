<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Cross Accel — 완성형 프로토타입</title>
<style>
  :root{
    --hp:#e0512f; --reach:#3a90c8; --cost:#f2c934; --accel:#31d0f0; --swift:#a978ff;
    --card-top:#28324d; --card-mid:#161d30; --card-bot:#0a0e18;
    --enemy:#e0512f; --mine:#31c5e0;
    --text:#eef3fa; --muted:#9aa6b8; --panel:rgba(22,28,42,.9); --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#04060a;height:100vh;width:100vw;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:'Pretendard','Malgun Gothic',sans-serif;color:var(--text);}
  .stage{width:1920px;height:1080px;position:relative;flex:none;transform-origin:center;overflow:hidden;
    background:radial-gradient(ellipse 900px 400px at 78% 12%,rgba(224,81,47,.09),transparent),
               radial-gradient(ellipse 900px 400px at 22% 88%,rgba(49,197,224,.09),transparent),
               linear-gradient(180deg,#0e0a12,#0a0d18 50%,#0b1120);}
  .screen{position:absolute;inset:0;display:none;}
  .screen.on{display:block;}

  /* 공통 헤더/버튼 */
  .top-bar{position:absolute;top:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:11px 22px;z-index:8;}
  .step{padding:7px 15px;border-radius:10px;font-size:14px;font-weight:800;background:rgba(12,16,26,.6);color:var(--muted);border:1.5px solid transparent;}
  .step.ban.on{background:rgba(224,81,47,.22);color:#ffd9cf;border-color:var(--ban);box-shadow:0 0 12px rgba(224,81,47,.4);}
  .step.pick.on{background:rgba(49,208,240,.18);color:#d6f7ff;border-color:var(--accel);box-shadow:0 0 12px rgba(49,208,240,.4);}
  .step.done{color:#5b6b8c;opacity:.6;}
  .step .arw{color:#3a4356;margin:0 4px;}
  .guide{position:absolute;top:92px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:800;z-index:8;}
  .guide .r{color:var(--enemy);} .guide .b{color:var(--accel);}
  /* 상대 진행 현황판 */
  .opp-status{position:absolute;top:26px;left:26px;z-index:8;
    background:linear-gradient(180deg,rgba(40,24,28,.92),rgba(20,14,18,.92));border:1.5px solid rgba(224,81,47,.35);
    border-radius:12px;padding:12px 18px;display:flex;flex-direction:column;gap:5px;width:300px;
    box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 18px rgba(224,81,47,.12);}
  .opp-status .opp-title{font-size:12px;font-weight:900;letter-spacing:2px;color:#ffb4a0;margin-bottom:2px;}
  .opp-status .opp-row{font-size:13.5px;color:#cdb8b8;}
  .opp-status .hl-e{color:var(--enemy);} .opp-status .hl-m{color:var(--accel);}
  .opp-status .secret{font-size:11px;color:#8a7a7a;background:rgba(0,0,0,.3);padding:1px 8px;border-radius:6px;margin-left:4px;}

  .btn{padding:15px 42px;border-radius:13px;font-size:19px;font-weight:900;cursor:pointer;letter-spacing:1px;border:none;
    background:linear-gradient(180deg,#5de3ff,#1ba9d4);color:#053040;
    box-shadow:0 4px 0 #10708f,0 6px 16px rgba(49,208,240,.4),inset 0 1px 0 rgba(255,255,255,.5);transition:all .1s;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #10708f;}
  .btn.off{opacity:.35;pointer-events:none;filter:grayscale(.5);}
  .btn.ban-c{background:linear-gradient(180deg,#ff8b6f,#d4501b);box-shadow:0 4px 0 #8f3010,0 6px 16px rgba(224,81,47,.4),inset 0 1px 0 rgba(255,255,255,.4);color:#3a1005;}
  .btn.ghost{background:rgba(30,38,58,.9);color:var(--muted);box-shadow:0 3px 0 rgba(0,0,0,.4);border:1px solid var(--line);font-size:15px;padding:11px 24px;}

  /* ===== 밴픽 카드 그리드 ===== */
  .grid{position:absolute;left:50%;transform:translateX(-50%);display:grid;gap:20px;top:180px;}
  .pcard{width:150px;height:229px;border-radius:12px;position:relative;overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,var(--card-top),var(--card-mid) 55%,var(--card-bot));
    box-shadow:0 6px 16px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08);transition:transform .14s,box-shadow .14s,filter .3s;}
  .pcard:hover{transform:translateY(-6px);box-shadow:0 12px 28px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.25);}
  .pcard .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;background:radial-gradient(circle at 50% 32%,#4d5c80,#181f31);}
  .pcard .scrim{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,transparent,rgba(6,9,16,.92) 45%);}
  .pcard .hx{position:absolute;top:6px;width:40px;height:46px;display:flex;flex-direction:column;align-items:center;color:#fff;font-weight:900;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);text-shadow:0 1px 2px rgba(0,0,0,.7);}
  .pcard .hx .v{font-size:18px;margin-top:3px;} .pcard .hx .k{font-size:8px;}
  .pcard .hx.h{left:6px;background:linear-gradient(180deg,#ff6a44,var(--hp));}
  .pcard .hx.r{right:6px;background:linear-gradient(180deg,#4aa6de,var(--reach));}
  .pcard .nm{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:14px;font-weight:800;text-shadow:0 1px 3px #000;padding:0 6px;}
  .pcard .wp{position:absolute;left:0;right:0;bottom:12px;display:flex;gap:5px;justify-content:center;}
  .pcard .wp span{font-size:10px;padding:1px 8px;border-radius:8px;background:rgba(120,90,200,.3);border:1px solid rgba(150,120,230,.45);color:#d3c8f5;}
  .pcard.sel{outline:3px solid #fff;outline-offset:1px;}
  .pcard.banned{cursor:default;filter:grayscale(1) brightness(.4);}
  .pcard.banned::after{content:'BAN';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--enemy);z-index:5;text-shadow:0 2px 8px #000;transform:rotate(-12deg);}
  .pcard.picked{cursor:default;box-shadow:0 0 0 3px var(--accel),0 0 22px rgba(49,208,240,.5);}
  .pcard.picked::after{content:'✓';position:absolute;top:8px;right:8px;background:var(--accel);color:#053;font-size:14px;font-weight:900;padding:2px 8px;border-radius:8px;z-index:6;}
  .pcard[data-lbl]::before{content:attr(data-lbl);position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;padding:2px 8px;border-radius:7px;z-index:7;background:rgba(0,0,0,.7);color:#fff;white-space:nowrap;}
  .pcard.picked[data-lbl]::before{background:var(--enemy);}

  /* ===== 배치 화면 ===== */
  .place-slots{position:absolute;left:50%;transform:translateX(-50%);top:230px;display:flex;gap:24px;}
  .pslot{width:160px;height:244px;border-radius:14px;border:2px dashed rgba(49,197,224,.4);background:rgba(16,22,36,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .2s;}
  .pslot:hover{border-color:var(--accel);background:rgba(49,208,240,.08);}
  .pslot .pos{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:var(--muted);white-space:nowrap;}
  .pslot .front-tag{position:absolute;top:8px;right:10px;font-size:11px;font-weight:900;color:#0a4a2a;background:rgba(240,255,240,.9);padding:1px 8px;border-radius:8px;}
  .pslot .ph{font-size:40px;color:rgba(49,208,240,.3);}
  .pslot.filled{border-style:solid;border-color:rgba(49,208,240,.5);background:linear-gradient(180deg,var(--card-top),var(--card-mid));}
  .place-pool{position:absolute;left:50%;transform:translateX(-50%);bottom:120px;display:flex;gap:18px;}
  .place-pool .pcard{width:130px;height:199px;}

  /* ===== 전투 화면 (v2 기반) ===== */
  .mid{position:absolute;left:140px;right:140px;top:539px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22) 30%,rgba(255,255,255,.22) 70%,transparent);}
  .front-hint{position:absolute;font-size:12px;color:var(--muted);letter-spacing:1px;}
  .actzone{position:absolute;border-radius:14px;border:1.5px solid rgba(255,255,255,.10);z-index:0;}
  .actzone.mine-z{border-color:rgba(49,197,224,.18);background:linear-gradient(180deg,rgba(49,197,224,.05),transparent);box-shadow:inset 0 0 30px rgba(49,197,224,.06);}
  .actzone.enemy-z{border-color:rgba(224,81,47,.18);background:linear-gradient(0deg,rgba(224,81,47,.05),transparent);box-shadow:inset 0 0 30px rgba(224,81,47,.06);}
  .actzone .azl{position:absolute;font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700;}
  .actzone.mine-z .azl{bottom:6px;right:12px;} .actzone.enemy-z .azl{top:6px;left:12px;}

  .cchar{position:absolute;width:150px;height:229px;border-radius:12px;overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,var(--card-top),var(--card-mid) 55%,var(--card-bot));
    box-shadow:0 6px 16px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08);
    transition:left .5s cubic-bezier(.2,.8,.3,1),opacity .4s,filter .3s,box-shadow .15s;}
  .cchar.mine-c{box-shadow:0 6px 16px rgba(0,0,0,.6),0 0 0 2px rgba(49,197,224,.35);}
  .cchar.enemy-c{box-shadow:0 6px 16px rgba(0,0,0,.6),0 0 0 2px rgba(224,81,47,.35);background:linear-gradient(0deg,var(--card-top),var(--card-mid) 55%,var(--card-bot));}
  .cchar .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;background:radial-gradient(circle at 50% 32%,#4d5c80,#181f31);}
  .enemy-c .art{background:radial-gradient(circle at 50% 68%,#6b4d55,#241a20);}
  .cchar .scrim{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,transparent,rgba(6,9,16,.92) 45%);}
  .enemy-c .scrim{bottom:auto;top:0;background:linear-gradient(0deg,transparent,rgba(6,9,16,.92) 45%);}
  .cchar .hx{position:absolute;width:40px;height:46px;display:flex;flex-direction:column;align-items:center;color:#fff;font-weight:900;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);text-shadow:0 1px 2px rgba(0,0,0,.7);top:6px;}
  .enemy-c .hx{top:auto;bottom:6px;}
  .cchar .hx .v{font-size:18px;margin-top:3px;} .cchar .hx .k{font-size:8px;}
  .cchar .hx.h{left:6px;background:linear-gradient(180deg,#ff6a44,var(--hp));}
  .cchar .hx.r{right:6px;background:linear-gradient(180deg,#4aa6de,var(--reach));}
  .enemy-c .hx.h{left:auto;right:6px;} .enemy-c .hx.r{right:auto;left:6px;}
  .cchar .nm{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:14px;font-weight:800;text-shadow:0 1px 3px #000;padding:0 6px;}
  .enemy-c .nm{bottom:auto;top:32px;}
  .cchar .wp{position:absolute;left:0;right:0;bottom:12px;display:flex;gap:5px;justify-content:center;}
  .enemy-c .wp{bottom:auto;top:10px;}
  .cchar .wp span{font-size:10px;padding:1px 8px;border-radius:8px;background:rgba(120,90,200,.3);border:1px solid rgba(150,120,230,.45);color:#d3c8f5;}
  .cchar .posb{position:absolute;top:56px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:rgba(240,255,240,.9);color:#0a4a2a;padding:1px 8px;border-radius:8px;display:none;}
  .enemy-c .posb{top:auto;bottom:56px;}
  .cchar.front .posb{display:block;}
  .cchar.in-reach{box-shadow:0 0 0 3px var(--cost),0 0 24px rgba(242,201,52,.55)!important;}
  .cchar.dim{filter:brightness(.45) saturate(.5);}
  .cchar.pickable{box-shadow:0 0 0 3px var(--accel),0 0 24px rgba(49,208,240,.6)!important;}
  .cchar .dchip{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--cost);color:#4a3a05;font-size:12px;font-weight:900;padding:1px 9px;border-radius:9px;display:none;z-index:3;}
  .enemy-c .dchip{top:auto;bottom:6px;}
  .cchar.in-reach .dchip{display:block;}
  .cchar.dead{opacity:0;pointer-events:none;}
  .cchar .dmgf{position:absolute;top:40%;left:50%;transform:translateX(-50%);font-size:34px;font-weight:900;color:#ff5a3c;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none;z-index:4;}
  .cchar .dmgf.show{animation:dmg .9s ease-out;} .cchar .dmgf.heal{color:#5fe08a;}
  @keyframes dmg{0%{opacity:0;transform:translate(-50%,6px) scale(.7);}20%{opacity:1;transform:translate(-50%,-4px) scale(1.15);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-26px);}}

  .aslot{position:absolute;width:150px;height:150px;border-radius:11px;border:2px dashed rgba(255,255,255,.14);background:rgba(14,19,32,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);transition:all .2s;}
  .aslot.mine-a{border-color:rgba(49,197,224,.3);} .aslot.enemy-a{border-color:rgba(224,81,47,.3);}
  .aslot.filled{border-style:solid;background:linear-gradient(180deg,#222b44,#141a2c);padding:8px;cursor:pointer;}
  .aslot.enemy-a.filled{background:linear-gradient(0deg,#222b44,#141a2c);}
  .aslot.filled .sart{font-size:30px;line-height:1;} .aslot.filled .sn{font-size:13px;font-weight:800;color:var(--text);text-align:center;}
  .aslot.filled .sm{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
  .aslot.filled .sm b{font-size:10px;padding:1px 7px;border-radius:7px;font-weight:900;}
  .aslot .sp{background:rgba(49,208,240,.2);color:#9be8f8;border:1px solid rgba(49,208,240,.5);}
  .aslot .co{background:rgba(242,201,52,.2);color:#f5dd8a;border:1px solid rgba(242,201,52,.5);}
  .aslot .sw{background:rgba(169,120,255,.25);color:#d9c4ff;border:1px solid rgba(169,120,255,.6);}
  .aslot .cancel-x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#e0512f;color:#fff;font-size:14px;font-weight:900;display:none;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.5);}
  .aslot.filled.mine-a:hover .cancel-x{display:flex;}
  .aslot.facedown{border-style:solid;background:repeating-linear-gradient(45deg,#2a1e2e,#2a1e2e 8px,#241a28 8px,#241a28 16px);color:rgba(224,81,47,.5);font-size:30px;font-weight:900;}
  .aslot.firing{box-shadow:0 0 0 3px var(--accel),0 0 26px rgba(49,208,240,.6);}
  .aslot .swbtn{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;padding:3px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;z-index:6;
    background:rgba(30,22,48,.95);color:var(--swift);border:1.5px solid var(--swift);}
  .aslot .swbtn.act{background:var(--swift);color:#1a0a30;box-shadow:0 0 12px rgba(169,120,255,.6);}
  .aslot .swbtn.dis{opacity:.3;pointer-events:none;filter:grayscale(1);}

  /* 손패 */
  .hand{position:absolute;left:0;right:0;bottom:0;height:250px;pointer-events:none;z-index:40;}
  .hcard{position:absolute;width:132px;height:202px;border-radius:11px;bottom:-46px;pointer-events:auto;cursor:pointer;
    background:linear-gradient(180deg,#2b3552,#181f33 60%,#0c1120);box-shadow:0 6px 16px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.1);
    transform-origin:50% 100%;transition:transform .18s,box-shadow .18s,opacity .3s;}
  .hcard:hover{z-index:50;transform:translateY(-62px) rotate(0deg) scale(1.12)!important;box-shadow:0 14px 30px rgba(0,0,0,.8),0 0 0 2.5px var(--accel);}
  .hcard.sel{box-shadow:0 0 0 3px var(--accel),0 0 26px rgba(49,208,240,.6);}
  .hcard.cost-sel{box-shadow:0 0 0 3px var(--cost),0 0 26px rgba(242,201,52,.6);}
  .hcard.unusable{filter:brightness(.5) saturate(.4);}
  .hcard .hn{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:14px;font-weight:800;padding:0 8px;}
  .hcard .hw{position:absolute;top:34px;left:0;right:0;text-align:center;font-size:10px;color:#c9b8f0;}
  .hcard .hart{position:absolute;top:54px;left:12px;right:12px;height:66px;border-radius:8px;background:radial-gradient(circle at 50% 40%,#4d5c80,#1a2136);display:flex;align-items:center;justify-content:center;font-size:32px;}
  .hcard .hd{position:absolute;top:126px;left:10px;right:10px;font-size:10px;line-height:1.32;color:#cdd6e4;text-align:center;}
  .hcard .hs{position:absolute;bottom:8px;left:10px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#7adcf2,#1893b4);display:flex;align-items:center;justify-content:center;font-weight:900;color:#04303c;font-size:15px;}
  .hcard .hc{position:absolute;bottom:8px;right:10px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f8de7c,#c79b18);display:flex;align-items:center;justify-content:center;font-weight:900;color:#4a3a05;font-size:15px;}

  /* 존 */
  .deck{position:absolute;width:120px;height:184px;border-radius:10px;background:repeating-linear-gradient(45deg,#232b42,#232b42 9px,#1b2236 9px,#1b2236 18px);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);flex-direction:column;gap:6px;}
  .deck b{font-size:20px;color:var(--text);}
  .deck.enemy-d span,.deck.enemy-d b{transform:rotate(180deg);}
  .zone{position:absolute;border-radius:12px;background:var(--panel);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--muted);}
  .zone b{color:var(--text);font-size:16px;}

  /* Phase 패널 */
  .phase{position:absolute;right:24px;top:70px;width:266px;border-radius:18px;display:flex;flex-direction:column;z-index:30;overflow:hidden;
    background:linear-gradient(180deg,rgba(28,36,58,.96),rgba(14,19,32,.96));border:1.5px solid rgba(49,208,240,.35);
    box-shadow:0 0 0 1px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.6),0 0 30px rgba(49,208,240,.15);}
  .phdr{display:flex;align-items:center;gap:8px;padding:13px 16px;background:linear-gradient(90deg,rgba(49,208,240,.18),transparent);border-bottom:1px solid rgba(49,208,240,.2);}
  .phdr .pico{font-size:18px;} .phdr .ptitle{font-size:16px;font-weight:900;letter-spacing:3px;color:#dff6ff;text-shadow:0 0 10px rgba(49,208,240,.5);}
  .phdr .pturn{margin-left:auto;font-size:11px;font-weight:800;color:var(--cost);letter-spacing:1px;background:rgba(242,201,52,.12);padding:3px 9px;border-radius:8px;border:1px solid rgba(242,201,52,.3);}
  .psteps{display:flex;padding:12px 12px 8px;gap:5px;}
  .pstep2{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:9px;font-size:10px;font-weight:700;color:#5b6b8c;background:rgba(10,14,24,.5);border:1.5px solid transparent;transition:all .25s;}
  .pstep2 .pi{font-size:15px;filter:grayscale(1) opacity(.5);transition:all .25s;}
  .pstep2.active{color:#eafaff;border-color:var(--accel);background:rgba(49,208,240,.16);box-shadow:0 0 14px rgba(49,208,240,.4);}
  .pstep2.active .pi{filter:none;transform:scale(1.2);}
  .pstep2.done{color:#4a6a5a;} .pstep2.done .pi{filter:grayscale(.3) opacity(.7);}
  .presource{display:flex;gap:14px;padding:6px 16px 8px;font-size:11px;color:var(--muted);}
  .presource .rr{display:flex;align-items:center;gap:5px;}
  .pcpip{display:flex;gap:3px;flex-wrap:wrap;}
  .pcpip i{width:13px;height:18px;border-radius:3px;background:linear-gradient(180deg,#f8de7c,#c79b18);box-shadow:0 0 5px rgba(242,201,52,.5);}
  .pcpip i.spent{background:#2a3145;box-shadow:none;opacity:.5;transform:rotate(70deg);}
  .swpip{display:flex;gap:3px;}
  .swpip i{width:13px;height:18px;border-radius:3px;background:linear-gradient(180deg,#c9a4ff,#7a4dd4);box-shadow:0 0 5px rgba(169,120,255,.5);}
  .swpip i.spent{background:#2a3145;box-shadow:none;opacity:.4;}

function log(msg,cls){const l=$('log');if(!l)return;const d=document.createElement('div');if(cls)d.className=cls;d.textContent=msg;l.appendChild(d);while(l.children.length>8)l.removeChild(l.firstChild);}

function cardMini(c){return `<div class="art">${c.art}</div><div class="scrim"></div>

  <div class="hx r"><span class="v">${c.reach}</span><span class="k">리치</span></div>

// 프리뷰
function preview(c){$('pvp').innerHTML=`<div class="ph h"><span class="v">${c.hp!=null?c.hp:c.mhp}</span><span class="k">체력</span></div>

// ============ [1] 밴 화면 ============
function renderBan(){
  show('ban');
  const el=$('scr-ban');
  el.innerHTML=`
    <div class="top-bar">
      <span class="step ban on">🚫 밴 1</span><span class="arw">▶</span>
      <span class="step pick">✓ 픽 2</span><span class="arw">▶</span>
      <span class="step ban">🚫 밴 1</span><span class="arw">▶</span>
      <span class="step pick">✓ 픽 2</span></div>
    <div class="guide">상대 카드 1장을 <span class="r">밴</span>하세요</div>
    <div class="grid" id="banGrid" style="grid-template-columns:repeat(5,150px);"></div>
    <div style="position:absolute;bottom:56px;right:56px;"><button class="btn ban-c off" id="banConfirm">밴 확정 ▶</button></div>`;
  const g=$('banGrid');
  EN_POOL.forEach(id=>{
    const c=CHARS[id];const d=document.createElement('div');d.className='pcard';
    if(S.myBans.includes(id)){d.classList.add('banned');}       // 내가 밴한 상대 카드
    else if(S.enPicks.includes(id)){d.classList.add('picked');d.setAttribute('data-lbl','상대 픽');} // 상대가 픽함 → 밴 불가
    else{if(S.selBan===id)d.classList.add('sel');
      d.onmouseenter=()=>preview(c);d.onmouseleave=hidePreview;
      d.onclick=()=>{S.selBan=(S.selBan===id?null:id);renderBan();};}
    d.innerHTML=cardMini(c);g.appendChild(d);
  });
  $('banConfirm').classList.toggle('off',!S.selBan);
  $('banConfirm').onclick=()=>{
    S.myBans.push(S.selBan);
    // 상대도 내 카드 1장 밴 (비밀 → 픽 화면에서 공개)
    const avail=MY_POOL.filter(id=>!S.enBans.includes(id)&&!S.myPicks.includes(id));
    S.enBans.push(avail[Math.floor(Math.random()*avail.length)]);
    S.selBan=null;S.banStep++;
    log('');
    nextBanPickStep();
  };

function renderPick(){

  seq.forEach((s,i)=>{const cls=s[0]+(i<S.banStep?' done':i===S.banStep?' on':'');
    th+=`<span class="step ${cls}">${s[1]}</span>`+(i<3?'<span class="arw">▶</span>':'');});
  $('pickTop').innerHTML=th;
  const g=$('pickGrid');
  MY_POOL.forEach(id=>{
    const c=CHARS[id];const d=document.createElement('div');d.className='pcard';
    if(S.enBans.includes(id)){d.classList.add('banned');d.setAttribute('data-lbl','상대 밴');}
    else if(S.myPicks.includes(id)){d.classList.add('picked');}
    else{if(S.selPick.includes(id))d.classList.add('sel');
      d.onmouseenter=()=>preview(c);d.onmouseleave=hidePreview;
      d.onclick=()=>{const p=S.selPick.indexOf(id);
        if(p>=0)S.selPick.splice(p,1);
        else{if(S.selPick.length>=need)S.selPick.shift();S.selPick.push(id);}
        renderPick();};}
    d.innerHTML=cardMini(c);g.appendChild(d);
  });
  $('pickConfirm').classList.toggle('off',S.selPick.length!==need);
  $('pickConfirm').onclick=()=>{
    S.myPicks.push(...S.selPick);
    // 상대 픽 (공개) — 내가 밴한 상대 카드(myBans)는 픽 못 함
    const avail=EN_POOL.filter(id=>!S.enPicks.includes(id)&&!S.myBans.includes(id));
    for(let k=0;k<need&&k<avail.length;k++)S.enPicks.push(avail[k]);
    S.selPick=[];S.banStep++;
    nextBanPickStep();
  };
}
function nextBanPickStep(){

    const posLabel = i===0?'P1 · 전방':(i===3?'P4 · 후방':'P'+(i+1));

    if(S.placed[i]){const c=CHARS[S.placed[i]];d.innerHTML+=cardMini(c);}

    d.onclick=()=>onSlotClick(i);

  S.myPicks.forEach(id=>{
    const c=CHARS[id];const placed=S.placed.includes(id);
    const d=document.createElement('div');d.className='pcard'+(placed?' picked':'')+(S.selPlaceCard===id?' sel':'');
    d.innerHTML=cardMini(c);

      d.onclick=()=>{S.selPlaceCard=(S.selPlaceCard===id?null:id);renderPlace();};}
    pp.appendChild(d);
  });
  $('placeConfirm').classList.toggle('off',S.placed.filter(x=>x).length!==4);
  $('placeConfirm').onclick=()=>startCost();
}
function onSlotClick(i){
  if(S.placed[i]){ // 캔슬: 슬롯 비우기
    S.selPlaceCard=null;S.placed[i]=null;renderPlace();return;
  }
  if(S.selPlaceCard){S.placed[i]=S.selPlaceCard;S.selPlaceCard=null;renderPlace();}
}

function startCost(){

function setBattlePhase(p){

function renderResources(){
  const cp=$('pcpip');if(cp){cp.innerHTML='';for(let i=0;i<S.costPool;i++){const s=document.createElement('i');if(i<S.costUsed)s.className='spent';cp.appendChild(s);}}
  const sp=$('swpip');if(sp){sp.innerHTML='';for(let i=0;i<S.swiftMax;i++){const s=document.createElement('i');if(i>=S.swiftRes)s.className='spent';sp.appendChild(s);}if(S.swiftMax===0)sp.innerHTML='<span style="font-size:10px;color:#5b6b8c">0</span>';}
}
function layoutBattle(){
  S.myParty.forEach((u,idx)=>{const el=$('mych'+idx);if(!el)return;const p=idx+1;
    el.style.left=MY_X(p)+'px';el.style.top=MY_CHAR_Y+'px';el.classList.toggle('front',p===1);
    el.querySelector('.hx.h .v').textContent=u.hp+(u.def?`+${u.def}`:'');});

    el.style.left=EN_X(p)+'px';el.style.top=EN_CHAR_Y+'px';el.classList.toggle('front',p===1);

  for(let i=0;i<4;i++){

  $('mtrash').textContent=S.mTrash;$('etrash').textContent=S.eTrash;

function renderSlot(el,act,side,idx,hide){
  el.classList.remove('filled','facedown','firing');
  el.onclick=null;
  if(!act){el.textContent='스킬 대기';return;}
  if(hide){el.classList.add('facedown');el.textContent='✕';return;}
  el.classList.add('filled');
  const sw=act.swift?'<b class="sw">⚡신속</b>':'';
  el.innerHTML=`<div class="cancel-x">✕</div><span class="sart">${act.sk.art}</span><span class="sn">${act.sk.nm}</span>
    <div class="sm"><b class="sp">속도 ${act.sk.spd}</b><b class="co">Cost ${act.sk.cost}</b>${sw}</div>`;
  if(side==='my'&&S.battlePhase==='ready'){
    // 캔슬
    el.querySelector('.cancel-x').onclick=(e)=>{e.stopPropagation();cancelSkill(idx);};
    // 신속 토글 버튼
    const swb=document.createElement('div');
    const canSwift = act.swift || S.swiftRes>0;
    swb.className='swbtn'+(act.swift?' act':'')+(canSwift?'':' dis');
    swb.textContent=act.swift?'⚡ 신속 ON':'⚡ 신속';
    swb.onclick=(e)=>{e.stopPropagation();toggleSwift(idx);};
    el.appendChild(swb);

}

// ===== 레디: 카드→캐릭터 배치 =====
function validUsers(sk){return S.myParty.map((u,idx)=>({u,idx})).filter(o=>!S.myActs[o.idx]&&o.u.hp>0&&(sk.wp==='공용'||sk.wp===o.u.char.wp));}
function renderHand(){
  const h=$('hand')||(()=>{const d=document.createElement('div');d.className='hand';d.id='hand';$('scr-battle').appendChild(d);return d;})();
  h.innerHTML='';const n=S.hand.length;
  S.hand.forEach((sk,i)=>{
    const el=document.createElement('div');el.className='hcard';
    const t=n>1?(i-(n-1)/2)/((n-1)/2):0;
    el.style.left=(960-66+t*((n-1)*60))+'px';
    el.style.transform=`rotate(${t*12}deg) translateY(${-(1-t*t)*18}px)`;
    if(S.selHand===i)el.classList.add('sel');
    if(S.drawCostSel.includes(i))el.classList.add('cost-sel');
    if(S.battlePhase==='drawcost'){
      // 드로우한 카드만 선택 가능, 나머지는 흐리게
      if(!S.newlyDrawn.includes(i))el.classList.add('unusable');
    }else{
      const usable=S.battlePhase==='ready'&&sk.cost<=(S.costPool-S.costUsed)&&validUsers(sk).length>0;
      if(!usable&&S.battlePhase==='ready')el.classList.add('unusable');
    }
    el.innerHTML=`<div class="hn">${sk.nm}</div><div class="hw">${sk.wp}</div><div class="hart">${sk.art}</div><div class="hd">${sk.d}</div><div class="hs">${sk.spd}</div><div class="hc">${sk.cost}</div>`;
    el.onmouseenter=()=>previewSkill(sk);el.onmouseleave=hidePreview;
    el.onclick=()=>onHandClick(i);
    h.appendChild(el);
  });
}
function onHandClick(i){
  if(S.battlePhase==='drawcost'){ // 드로우 후 코스트 선택 모드
    if(!S.newlyDrawn.includes(i)){log('방금 뽑은 카드만 코스트로 낼 수 있습니다','le');return;}
    const p=S.drawCostSel.indexOf(i);
    if(p>=0)S.drawCostSel.splice(p,1);
    else{if(S.drawCostSel.length>=2)S.drawCostSel.shift();S.drawCostSel.push(i);}
    renderHand();return;
  }
  if(S.battlePhase!=='ready')return;
  const sk=S.hand[i];
  const users=validUsers(sk);
  if(sk.cost>(S.costPool-S.costUsed)){log(`「${sk.nm}」 코스트 부족 (필요 ${sk.cost})`,'le');return;}
  if(users.length===0){log(`「${sk.nm}」(${sk.wp}) — 쓸 수 있는 캐릭터가 없음`,'le');return;}
  S.selHand=(S.selHand===i?-1:i);renderHand();
  clearPickable();
  if(S.selHand>=0){
    log(`「${sk.nm}」 선택 — 청록 캐릭터를 클릭하세요`,'lm');
    users.forEach(o=>$('mych'+o.idx).classList.add('pickable'));
  }
}
function clearPickable(){document.querySelectorAll('.cchar').forEach(e=>e.classList.remove('pickable'));}
let pendingUser=null; // 타겟 지정 대기 중인 배치
function onMyCharClick(idx){
  if(S.battlePhase!=='ready')return;
  // 타겟 지정 모드: 이미 유저 캐릭 선택됨 → 여기선 무시(적 클릭으로 처리)
  if(pendingUser!=null)return;
  if(S.selHand<0)return;
  const sk=S.hand[S.selHand],u=S.myParty[idx];
  if(S.myActs[idx]){log('이미 스킬 배치됨','le');return;}
  if(!(sk.wp==='공용'||sk.wp===u.char.wp)){log(`${u.char.nm}: ${sk.wp} 사용 불가`,'le');return;}
  if(sk.dmg<0){
    // 회복: 타겟 지정 없이 바로 배치 (자동 최저HP 아군)
    commitAct(idx,sk,u,null);
  }else{
    // 공격: 리치 내 적 중 타겟 선택
    const p=idx+1, reach=u.char.reach;
    const inReach=S.enParty.map((t,qi)=>({t,qi,d:p+qi})).filter(o=>o.t.hp>0&&o.d<=reach);
    if(inReach.length===0){log(`${u.char.nm}: 리치 내 대상 없음 (그래도 배치됨, 불발 예정)`,'lk');commitAct(idx,sk,u,null);return;}
    if(inReach.length===1){commitAct(idx,sk,u,inReach[0].qi);return;}
    // 여러 대상 → 지정 모드
    pendingUser={idx,sk,u};
    clearPickable();
    inReach.forEach(o=>{const el=$('ench'+o.qi);if(el){el.classList.add('pickable');el.onclick=()=>onTargetClick(o.qi);}});
    log(`${u.char.nm} 「${sk.nm}」 — 때릴 대상을 클릭 (${inReach.length}명)`,'lm');
  }
}
function onTargetClick(qi){
  if(!pendingUser)return;
  const {idx,sk,u}=pendingUser;
  commitAct(idx,sk,u,qi);
  // 적 클릭 핸들러 정리
  S.enParty.forEach((t,i)=>{const el=$('ench'+i);if(el){el.classList.remove('pickable');el.onclick=null;}});
  pendingUser=null;
}
function commitAct(idx,sk,u,targetQi){
  S.myActs[idx]={sk,user:u,userIdx:idx,swift:false,target:targetQi};
  S.costUsed+=sk.cost;S.mTrash++;
  S.hand.splice(S.selHand,1);S.selHand=-1;clearPickable();
  const tn = targetQi!=null && S.enParty[targetQi] ? ` → ${S.enParty[targetQi].char.nm}` : '';
  log(`${u.char.nm} ← 「${sk.nm}」${tn}`,'lm');
  renderHand();layoutBattle();
}
function cancelSkill(idx){  // 캔슬: 손패 복귀 + 코스트 환급
  const act=S.myActs[idx];if(!act)return;
  if(typeof pendingUser!=='undefined')pendingUser=null;
  if(act.swift){S.swiftRes++;}  // 신속도 환급
  S.costUsed-=act.sk.cost;S.mTrash--;
  S.hand.push(act.sk);S.myActs[idx]=null;
  log(`「${act.sk.nm}」 취소 — 손패 복귀`,'lk');
  renderHand();layoutBattle();
}
function toggleSwift(idx){
  const act=S.myActs[idx];if(!act)return;
  if(act.swift){act.swift=false;S.swiftRes++;log(`「${act.sk.nm}」 신속 해제`,'lsw');}
  else{if(S.swiftRes<=0){log('신속 자원 부족','le');return;}act.swift=true;S.swiftRes--;log(`「${act.sk.nm}」 신속 지정 ⚡`,'lsw');}
  layoutBattle();
}

// ===== 사거리 =====
function showReach(u,side){
  const p=(side==='my'?S.myParty:S.enParty).indexOf(u)+1;
  const targets=side==='my'?S.enParty:S.myParty;const pre=side==='my'?'ench':'mych';
  targets.forEach((t,qi)=>{const d=p+qi;const el=$(pre+qi);if(!el||t.hp<=0)return;
    if(d<=u.char.reach){el.classList.add('in-reach');el.querySelector('.dchip').textContent='거리 '+d;}
    else el.classList.add('dim');});
}
function clearReach(){document.querySelectorAll('.cchar').forEach(e=>e.classList.remove('in-reach','dim'));}

// ===== 상대 AI 레디 =====
function enemyReady(){
  let plays=0;
  for(const sk of [...EN_SKILLS].sort(()=>Math.random()-.5)){
    if(plays>=2||(S.enPool-S.enUsed)<sk.cost)continue;
    const users=S.enParty.map((u,idx)=>({u,idx})).filter(o=>!S.enActs[o.idx]&&o.u.hp>0&&(sk.wp==='공용'||sk.wp===o.u.char.wp));
    if(!users.length)continue;
    const o=users[0];S.enActs[o.idx]={sk,user:o.u,userIdx:o.idx,swift:false};S.enUsed+=sk.cost;S.eTrash++;plays++;
  }
}

// ===== 다음 버튼 =====
async function onNextBtn(){
  if(S.busy)return;
  if(S.battlePhase==='ready'){await runAction();}
  else if(S.battlePhase==='drawcost'){confirmDrawCost();}
}

// ===== 액션 =====
async function runAction(){
  S.busy=true;setBattlePhase('action');$('nextb').classList.add('off');
  clearPickable();layoutBattle();
  // 발동 순서: 신속 먼저(속도순) → 일반(속도순)
  const acts=[];
  S.myActs.forEach((a,i)=>{if(a)acts.push({side:'my',...a});});
  S.enActs.forEach((a,i)=>{if(a)acts.push({side:'en',...a});});
  acts.sort((a,b)=>{
    if(a.swift!==b.swift)return a.swift?-1:1; // 신속 우선
    return b.sk.spd-a.sk.spd;                  // 속도순
  });
  // 액셀 체크: 인접 두 액션 속도 동일 & 둘 다 같은 신속그룹
  for(let i=0;i<acts.length;i++){
    const act=acts[i];
    const arr=act.side==='my'?S.myParty:S.enParty;
    if(act.user.hp<=0){log(`${act.user.char.nm} 사망 — 「${act.sk.nm}」 불발`,'le');continue;}
    // 액셀 판정: 다음 액션과 속도·신속 동일 & 다른 진영
    if(i+1<acts.length){const nx=acts[i+1];
      if(nx.sk.spd===act.sk.spd&&nx.swift===act.swift&&nx.side!==act.side&&nx.user.hp>0){
        await accelProcess(act,nx);
      }
    }
    if(act._accelFail){log(`${act.user.char.nm}「${act.sk.nm}」— 액셀 패배로 불발`,'lk');continue;}
    const slotId=(act.side==='my'?'my':'en')+'slot'+act.userIdx;
    const slot=$(slotId);if(slot)slot.classList.add('firing');
    await sleep(480);
    resolveAct(act);
    layoutBattle();await sleep(400);
    if(slot)slot.classList.remove('firing');
    // 사망 즉시 반영은 엔드에서
  }
  await endPhase();
}
function resolveAct(act){
  const p=(act.side==='my'?S.myParty:S.enParty).indexOf(act.user)+1;
  if(act.sk.dmg<0){
    const allies=act.side==='my'?S.myParty:S.enParty;
    const alive=allies.filter(u=>u.hp>0);
    const t=alive.reduce((a,b)=>a.hp/a.char.mhp<b.hp/b.char.mhp?a:b);
    t.hp=Math.min(t.char.mhp,t.hp-act.sk.dmg);
    floatNum(act.side==='my'?'mych':'ench',allies.indexOf(t),'+'+(-act.sk.dmg),true);
    log(`${act.user.char.nm}「${act.sk.nm}」→ ${t.char.nm} 회복 ${-act.sk.dmg}`,act.side==='my'?'lm':'le');
  }else{
    const targets=act.side==='my'?S.enParty:S.myParty;const reach=act.user.char.reach;
    let idx;
    if(act.side==='my'&&act.target!=null&&targets[act.target]&&targets[act.target].hp>0&&(p+act.target)<=reach){
      idx=act.target; // 유저가 지정한 타겟
    }else{
      idx=targets.findIndex((t,qi)=>t.hp>0&&(p+qi)<=reach); // 자동(상대 AI 또는 지정 대상 사망)
    }
    if(idx<0){log(`${act.user.char.nm}「${act.sk.nm}」— 리치 내 대상 없음`,'lk');return;}
    const t=targets[idx];
    let dmg=act.sk.dmg;
    if(t.def>0){const ab=Math.min(t.def,dmg);t.def-=ab;dmg-=ab;}
    t.hp-=dmg;
    floatNum(act.side==='my'?'ench':'mych',targets.indexOf(t),'-'+act.sk.dmg,false);
    log(`${act.user.char.nm}「${act.sk.nm}」→ ${t.char.nm} 데미지 ${act.sk.dmg}`,act.side==='my'?'lm':'le');
  }
}
function floatNum(pre,idx,txt,heal){const el=$(pre+idx);if(!el)return;const f=el.querySelector('.dmgf');
  f.textContent=txt;f.classList.toggle('heal',heal);f.classList.remove('show');void f.offsetWidth;f.classList.add('show');}

// ===== 액셀 프로세스 =====
async function accelProcess(a,b){
  const ov=$('accelov'),cc=$('accelcards');
  const weps=['한손검','두손검','활','책','스태프','악기','방패'];
  const aName=a.side==='my'?'나':'상대', bName=b.side==='my'?'나':'상대';
  // 초기: 두 캐릭터 마주보기 (카드 뒷면)
  cc.innerHTML=`
    <div class="accel-side" id="acA"><span class="lbl">${aName} · ${a.user.char.nm}</span>
      <div class="accel-top" id="acAtop">🎴<span class="wt">?</span></div>
      <span style="font-size:11px;color:var(--muted)">필요 무기: ${a.user.char.wp}</span></div>
    <div class="accel-vs" id="acVS">VS</div>
    <div class="accel-side" id="acB"><span class="lbl">${bName} · ${b.user.char.nm}</span>
      <div class="accel-top" id="acBtop">🎴<span class="wt">?</span></div>
      <span style="font-size:11px;color:var(--muted)">필요 무기: ${b.user.char.wp}</span></div>`;
  ov.classList.add('show');
  log(`⚡ 액셀 발동! 속도 ${a.sk.spd} 동점`,'lsw');
  await sleep(900); // 긴장

  let aWin=false,bWin=false,round=0;
  while(true){
    round++;
    if(round>1){log(`  둘 다 일치 — 재대결 ${round}라운드`,'lsw');await sleep(600);}
    // A 먼저 한 장 넘김
    $('acAtop').classList.remove('flip');
    const aTop=weps[Math.floor(Math.random()*weps.length)];
    await sleep(700);
    $('acAtop').innerHTML=`🎴<span class="wt">${aTop}</span>`;
    aWin=(aTop===a.user.char.wp);
    $('acA').classList.toggle('win',aWin);
    log(`  ${aName} 덱탑: ${aTop} ${aWin?'✓ 일치!':'✗'}`, aWin?'lsw':'lk');
    await sleep(900); // 쫄리게

    // B 넘김
    const bTop=weps[Math.floor(Math.random()*weps.length)];
    await sleep(700);
    $('acBtop').innerHTML=`🎴<span class="wt">${bTop}</span>`;
    bWin=(bTop===b.user.char.wp);
    $('acB').classList.toggle('win',bWin);
    log(`  ${bName} 덱탑: ${bTop} ${bWin?'✓ 일치!':'✗'}`, bWin?'lsw':'lk');
    await sleep(900);

    if(aWin&&bWin){ // 둘 다 성공 → 재대결
      $('acA').classList.remove('win');$('acB').classList.remove('win');
      $('acAtop').innerHTML='🎴<span class="wt">?</span>';$('acBtop').innerHTML='🎴<span class="wt">?</span>';
      if(round>=5)break; continue;
    }
    break;
  }
  await sleep(500);
  if(aWin&&!bWin){b._accelFail=true;log(`  ⚡ ${a.user.char.nm} 선공! ${b.user.char.nm} 불발`,'lsw');}
  else if(bWin&&!aWin){a._accelFail=true;log(`  ⚡ ${b.user.char.nm} 선공! ${a.user.char.nm} 불발`,'lsw');}
  else{log(`  → 무승부, 원래 순서대로 진행`,'lk');}
  await sleep(700);
  ov.classList.remove('show');
}

// ===== 엔드: 사망 → 전방 당김 =====
async function endPhase(){
  setBattlePhase('end');
  const deadM=S.myParty.filter(u=>u.hp<=0),deadE=S.enParty.filter(u=>u.hp<=0);
  for(const u of[...deadM,...deadE]){
    const isMy=S.myParty.includes(u);const idx=(isMy?S.myParty:S.enParty).indexOf(u);
    const el=$((isMy?'mych':'ench')+idx);if(el)el.classList.add('dead');
    log(`☠ ${u.char.nm} 전투불능 → 코스트 존`,'lk');
  }
  if(deadM.length||deadE.length){
    await sleep(500);
    // 사망 제거 후 재빌드 (전방으로 당김)
    S.myParty=S.myParty.filter(u=>u.hp>0);S.enParty=S.enParty.filter(u=>u.hp>0);
    S.costPool+=deadM.length;S.enPool+=deadE.length;
    S.myActs=[null,null,null,null];S.enActs=[null,null,null,null];
    rebuildChars();layoutBattle();await sleep(650);
  }else{S.myActs=[null,null,null,null];S.enActs=[null,null,null,null];}
  if(S.enParty.length===0){$('bannertxt').textContent='승리';$('banner').classList.add('show');return;}
  if(S.myParty.length===0){$('bannertxt').textContent='패배';$('banner').classList.add('show');return;}
  // 다음 턴: 드로우 페이즈부터
  S.turn++;await sleep(400);
  S.eDeck-=2;S.enPool+=2;S.enUsed=0; // 상대 드로우/코스트/언탭(간이)
  startDrawPhase(false);
}
function updateDrawCostBtn(){/* 0~2장 모두 허용 */}
function confirmDrawCost(){
  // 선택한 (방금 뽑은) 카드만 코스트로
  const add=S.drawCostSel.length;
  S.hand=S.hand.filter((_,i)=>!S.drawCostSel.includes(i));
  S.costPool+=add;S.costUsed=0;S.drawCostSel=[];S.newlyDrawn=[];
  S.battlePhase='ready';setBattlePhase('ready');
  S.swiftRes=S.swiftMax; // 신속 자원 언탭(매턴 회복)
  enemyReady();
  $('nextb').innerHTML='<span>▶</span> 액션 개시';
  log('레디 — 카드 선택 후 캐릭터 클릭','lm');
  layoutBattle();renderHand();
}
function drawCards(n){for(let i=0;i<n;i++){if(S.mDeck<=0){S.mDeck=S.mTrash;S.mTrash=0;log('덱 리셔플','lm');}S.mDeck--;S.hand.push(SKILLS[Math.floor(Math.random()*SKILLS.length)]);}}
function rebuildChars(){
  document.querySelectorAll('.cchar').forEach(e=>e.remove());
  S.myParty.forEach((u,idx)=>makeChar(u,'my',idx));
  S.enParty.forEach((u,idx)=>makeChar(u,'en',idx));
}
